name: JabouTube Android Audio APK
on:
  workflow_dispatch:
  push:
    branches: [jaboutube-ios]
    paths:
      - 'android/**'
      - '.github/workflows/jaboutube-audio-android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace -p android :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: JabouTube-Audio-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
