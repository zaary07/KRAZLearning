name: JabouTube Android Audio APK
on:
  workflow_dispatch:
  push:
    branches: [jaboutube-ios]
    paths:
      - 'android/**'
      - '.github/workflows/jaboutube-audio-android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android platform tools
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace -p android :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: JabouTube-Audio-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
