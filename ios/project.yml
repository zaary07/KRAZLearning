name: JabouTubeiOS
options:
  bundleIdPrefix: com.jaboutube
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  JabouTubeiOS:
    type: application
    platform: iOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaboutube.ios
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        SUPPORTS_MACCATALYST: NO
schemes:
  JabouTubeiOS:
    build:
      targets:
        JabouTubeiOS: all
